<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEweek02_hw</title>
    <link rel="stylesheet" href="week02_hw.css" />
  </head>

  <body>
    <div class="container">
      <!-- 프로필 -->
      <div class="header">
        <div class="profile">
          <img src="profile.svg" class="profile-img" />
          <span class="username">choiijuu_</span>
        </div>

        <img src="ellipsis.svg" class="elipsis" />
      </div>

      <!-- 게시물 이미지 -->
      <div class="post-img">
        <img src="food.jpg" />
      </div>

      <!-- 아이콘 -->
      <div class="icons">
        <div class="left-icons">
          <img src="heart.svg" class="like-icon" />
          <span class="like-count">50</span>

          <img src="message.svg" /> 5
          <img src="airplane.svg" />
        </div>

        <img src="bookmark.svg" class="bookmark" />
      </div>
      <!-- 좋아요 -->
      <div class="likes">좋아요 50개</div>

      <!-- 캡션 -->
      <div class="caption">
        <span class="user">choiijuu_</span>
        <span class="text-short">시험 끝난 후 야식 ... ❤️</span>
        <span class="more">... 더 보기</span><br />
        <span class="text-full" style="display: none">
          결과는 생각하지 말고 일단 먹기 ^.^ !
        </span>
      </div>

      <!-- 날짜 -->
      <div class="date">5월 3일</div>
    </div>

    <script src="week02_hw.js"></script>
  </body>
</html>
